# CI/CD pipeline for the Multi Modal RAG service, running on GitHub-hosted
# runners — no Jenkins server to maintain.
#
# Flow: lint -> test -> build image -> push to ECR -> (on main) deploy to EKS.
#
# One-time setup before this works:
#   1. Repo Settings -> Secrets and variables -> Actions, add:
#        - AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: an IAM user with
#          ECR push, EKS and RDS permissions (or switch to OIDC, below).
#        - TF_API_TOKEN: a HCP Terraform team token — state + locking live
#          in HCP (see the `cloud` block in infra/terraform/main.tf), no
#          S3 bucket or DynamoDB table required.
#        - DB_PASSWORD: the RDS master password, consumed by Terraform.
#   2. HCP Terraform: create the organization + workspace (execution mode
#      "Local") named in infra/terraform/main.tf, then run
#      `terraform init` once locally to migrate any local state into HCP.
#   3. Apply infra/k8s/secret.yaml ONCE by hand with the real DATABASE_URL
#      and GROQ_API_KEY.  The workflow deliberately never applies it, so
#      the placeholder values can't overwrite your real secrets.
#
# OIDC (recommended over long-lived keys): create an OIDC provider in IAM,
# attach an appropriate role, store the role ARN as AWS_ROLE_ARN, and
# replace the access-key lines in configure-aws-credentials with:
#     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

name: CI/CD

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: multimodal-rag
  AWS_REGION: us-east-1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write # needed only for OIDC
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests pipelines scripts

      - name: Test
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  build-push:
    needs: lint-test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Logs Docker into ECR (fresh token every run, unlike the 12h-expiry
      # dance Jenkins needed) and exposes the registry URL as an output.
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: image
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          # GitHub's cache backend makes the ~2GB torch layers incremental
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_db_pass: ${{ secrets.DB_PASSWORD }}
          # HCP Terraform token — state + locking live in HCP (cloud block)
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name multimodal-rag

      - name: Apply manifests
        # secret.yaml is excluded on purpose — it holds real credentials
        # and is applied by hand once (see header comment).
        run: |
          kubectl apply \
            -f infra/k8s/configmap.yaml \
            -f infra/k8s/deployment.yaml \
            -f infra/k8s/service.yaml \
            -f infra/k8s/hpa.yaml

      - name: Roll out the new image
        run: |
          kubectl set image deployment/multimodal-rag \
            multimodal-rag=${{ needs.build-push.outputs.image }}

      - name: Verify
        run: |
          kubectl rollout status deployment/multimodal-rag --timeout=180s
          kubectl run health-check --rm -i --restart=Never --image=curlimages/curl \
            --command -- curl -fsS http://multimodal-rag:8000/health
