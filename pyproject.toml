# Project configuration for the Multi Modal RAG service.
# Kept intentionally small: ruff (lint) and pytest (tests) are what the
# GitHub Actions workflow invokes.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
