# Deployment for the Multi Modal RAG API.
#
# Notes:
# - replicas=1 by default because every pod loads its own copy of the ML
#   models (several GB of RAM); scale with the HPA only when memory allows.
# - The model cache is an emptyDir (fresh download per pod on first start).
#   Swap it for a PersistentVolumeClaim in production to survive restarts.
# - Liveness probes the process; readiness waits for the DB pool + models.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: multimodal-rag
  labels:
    app: multimodal-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multimodal-rag
  template:
    metadata:
      labels:
        app: multimodal-rag
    spec:
      containers:
        - name: multimodal-rag
          image: multimodal-rag:latest # replaced by the CI deploy step
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: multimodal-rag-config
            - secretRef:
                name: multimodal-rag-secret
          env:
            - name: HF_HOME
              value: /data/cache/huggingface
            - name: TORCH_HOME
              value: /data/cache/torch
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /readiness
              port: 8000
            initialDelaySeconds: 90   # ML models load on startup
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
