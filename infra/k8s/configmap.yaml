# Non-secret application configuration for the Multi Modal RAG API.
# Secrets (DATABASE_URL, GROQ_API_KEY) live in secret.yaml — never here.

apiVersion: v1
kind: ConfigMap
metadata:
  name: multimodal-rag-config
data:
  # ML models (any of these can be overridden without redeploying)
  GROQ_MODEL: "llama-3.3-70b-versatile"
  TEXT_EMBED_MODEL: "BAAI/bge-small-en-v1.5"
  IMAGE_EMBED_MODEL: "google/siglip-base-patch16-224"
  RERANKER_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  WHISPER_MODEL: "small.en"
  # Server
  HOST: "0.0.0.0"
  PORT: "8000"
  # Paths (backed by volumes in deployment.yaml)
  IMAGE_DIR: "/data/images"
  UPLOAD_DIR: "/data/uploads"
