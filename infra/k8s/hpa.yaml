# HorizontalPodAutoscaler for the Multi Modal RAG API.
# Scales on CPU; target 70% so a burst of /query traffic (ML + LLM bound)
# gets a second pod before the first one saturates.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: multimodal-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: multimodal-rag
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
