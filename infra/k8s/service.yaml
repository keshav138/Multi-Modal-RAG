# ClusterIP service for the Multi Modal RAG API.
# Expose externally with an Ingress (TLS) or a LoadBalancer — never directly.

apiVersion: v1
kind: Service
metadata:
  name: multimodal-rag
  labels:
    app: multimodal-rag
spec:
  type: ClusterIP
  selector:
    app: multimodal-rag
  ports:
    - name: http
      port: 8000
      targetPort: 8000
