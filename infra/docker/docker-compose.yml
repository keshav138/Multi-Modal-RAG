# Local orchestration for the full Multi Modal RAG stack:
#   - app        : the FastAPI service (built from infra/docker/Dockerfile)
#   - db         : PostgreSQL with the pgvector extension
#   - prometheus : scrapes the app's /metrics endpoint
#   - grafana    : dashboards on top of Prometheus (admin / admin)
#
# Usage:
#   set GROQ_API_KEY in your shell, then:
#   docker compose -f infra/docker/docker-compose.yml up --build
#
# The app container needs DATABASE_URL and GROQ_API_KEY (see .env.example);
# both are provided here with local defaults for development only.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5432:5432"

  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your environment}
      GROQ_MODEL: llama-3.3-70b-versatile
      IMAGE_DIR: /app/data/out_images
      UPLOAD_DIR: /app/data/uploads
    volumes:
      # Persist ingested images/uploads and the ML model cache across restarts
      - images:/app/data/out_images
      - uploads:/app/data/uploads
      - modelcache:/app/.cache
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      # Pre-provisioned Prometheus datasource + the RAG dashboard
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  images:
  uploads:
  modelcache:
